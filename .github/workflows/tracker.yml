name: Toptoon release tracker

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - dry-run
          - test

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run chapter release tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "dry-run" ]; then
            python tracker.py --dry-run
          elif [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python tracker.py --test-notification
          else
            python tracker.py
          fi

      - name: Run new series tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "dry-run" ]; then
            python new_series_tracker.py --dry-run
          elif [ "${{ github.event.inputs.mode }}" != "test" ]; then
            python new_series_tracker.py
          fi

      - name: Commit and push state changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Add both state files
          git add state.json new_series_state.json
          
          # Commit and push only if there are changes to avoid job failures
          git diff --staged --quiet || (git commit -m "chore: update tracking state" && git push)
