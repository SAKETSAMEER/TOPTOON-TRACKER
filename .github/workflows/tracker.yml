name: Toptoon Release Tracker

on:
  schedule:
    # Runs every 30 minutes at minutes 12 and 42 of every hour
    - cron: '12,42 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - dry-run
          - test

concurrency:
  group: toptoon-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run trackers
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python tracker.py --test-notification
          elif [ "${{ github.event.inputs.mode }}" = "dry-run" ]; then
            python tracker.py --dry-run
          else
            python tracker.py
            python new_titles.py
          fi

      - name: Commit and push state changes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage both chapter and new title state files
          git add state.json 2>/dev/null || true
          git add new_series_state.json 2>/dev/null || true
          git add seen_series.json 2>/dev/null || true

          # Commit only if files were modified
          if ! git diff --staged --quiet; then
            git commit -m "Update tracker state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
